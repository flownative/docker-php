name: Test Image Formats
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.2.34, 8.3.35, 8.4.26, 8.5.11 ]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Forks have no secrets; the build then pulls from Docker Hub anonymously.
      HAS_DOCKER_HUB_SECRETS: ${{ secrets.DOCKER_IO_REGISTRY_USER != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.HAS_DOCKER_HUB_SECRETS == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_IO_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_IO_REGISTRY_PASSWORD }}

      # Built from scratch on purpose: the GitHub Actions cache evicts layer
      # blobs while the cache index still references them, and BuildKit then
      # fails the build instead of treating it as a cache miss. A native
      # amd64 build is fast enough without a cache.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          tags: flownative/php:test

      # The container runs as uid 1000, so the results directory must be
      # writable for everyone.
      - name: Run image format tests
        run: |
          mkdir -p "${RUNNER_TEMP}/results"
          chmod 0777 "${RUNNER_TEMP}/results"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/tests:/tests:ro" \
            --volume "${RUNNER_TEMP}/results:/results" \
            flownative/php:test \
            php /tests/image-formats.php --output-dir=/results

      - name: Add results to job summary
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/results/summary.md" ]; then
            cat "${RUNNER_TEMP}/results/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload generated images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-formats-php-${{ matrix.php }}
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
