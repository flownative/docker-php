name: Build Docker Image
on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      matrix:
        php: [ 8.2.34, 8.3.35, 8.4.26, 8.5.11 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'main'
          fetch-depth: 100

      - name: Determine latest version
        id: latest_version
        uses: flownative/action-git-latest-release@v1

      - run: |
          sudo chmod -R ugo+rwX . && shopt -s dotglob && rm -rf *

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.latest_version.outputs.tag }}
          fetch-depth: 100

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=false
          images: |
            flownative/php
            harbor.flownative.io/docker/php
          labels: |
            org.opencontainers.image.title=PHP
            org.opencontainers.image.description=Docker image providing PHP CLI and PHP-FPM with various extensions pre-installed
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Flownative GmbH
            org.opencontainers.image.version=${{ matrix.php }}
          tags: |
            type=semver,pattern={{major}}.{{minor}},value=${{ matrix.php }}
            type=semver,pattern={{version}},value=${{ matrix.php }}

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_IO_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_IO_REGISTRY_PASSWORD }}

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.flownative.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}

      # One cache per minor version, so a new patch release overwrites the
      # cache of the previous one instead of leaving it behind in the registry.
      - name: Determine build cache reference
        id: cache
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: echo "ref=harbor.flownative.io/docker/php-build-cache:${PHP_VERSION%.*}" >> "${GITHUB_OUTPUT}"

      # The cache lives in the registry rather than in the GitHub Actions
      # cache: the latter evicts layer blobs while the cache index still
      # references them, and BuildKit then fails the build instead of treating
      # it as a cache miss.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

  announce:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Dispatch to beach-php
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.FLOWNATIVE_BOT_TOKEN }}
          repository: flownative/docker-beach-php
          event-type: php-images-built
          client-payload: '{"image_name": "flownative/docker-php/php"}'

      - name: Dispatch to composer
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.FLOWNATIVE_BOT_TOKEN }}
          repository: flownative/docker-composer
          event-type: php-images-built
          client-payload: '{"image_name": "flownative/docker-php/php"}'
